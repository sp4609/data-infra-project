[project]
name = "population_growth"

[source]
type = "worldbank"
indicator = "SP.POP.GROW"
years = "2015:2023"

[[checks]]
name = "at least 75% of growth rates are present"
why = "Too many missing growth rates would make country comparisons less representative."
sql = """
SELECT CASE
    WHEN count(*) > 0 AND count(value) >= 0.75 * count(*) THEN 0
    ELSE 1
END
FROM raw
"""

[[checks]]
name = "country-year keys are present and unique"
why = "Missing keys leave records unmatched, and duplicate keys can multiply rows in a join."
sql = """
SELECT count(*)
FROM (
    SELECT country_code, year
    FROM raw
    GROUP BY country_code, year
    HAVING count(*) > 1
        OR country_code IS NULL
        OR trim(country_code) = ''
        OR year IS NULL
) AS bad_keys
"""

[[checks]]
name = "reported growth rates are finite"
why = "Non-finite growth rates could invalidate averages and charts."
sql = """
SELECT count(*)
FROM raw
WHERE value IS NOT NULL AND NOT isfinite(value)
"""

[[checks]]
name = "years are within 2015–2023"
why = "Years outside the requested window could distort the comparison with the urban population data."
sql = """
SELECT count(*)
FROM raw
WHERE year NOT BETWEEN 2015 AND 2023
"""

[[checks]]
name = "growth data is available for 2023"
why = "Without a 2023 observation, the table would miss the final year of the comparison."
sql = """
SELECT CASE WHEN count(*) > 0 THEN 0 ELSE 1 END
FROM raw
WHERE year = 2023 AND value IS NOT NULL
"""

[[tables]]
name = "population_growth"
sql = """
SELECT country_code, country, region, income_level, year,
       value AS population_growth_pct
FROM raw
"""

[[tables]]
name = "population_growth_trend"
sql = """
SELECT year,
       round(avg(population_growth_pct), 3) AS avg_growth_pct,
       count(*) AS countries_reporting,
       count(*) FILTER (WHERE population_growth_pct < 0) AS countries_declining
FROM population_growth
WHERE population_growth_pct IS NOT NULL
GROUP BY year
ORDER BY year
"""

[[tables]]
name = "population_growth_change"
sql = """
WITH endpoints AS (
    SELECT country_code, country, region,
           max(population_growth_pct) FILTER (WHERE year = 2015) AS growth_2015_pct,
           max(population_growth_pct) FILTER (WHERE year = 2023) AS growth_2023_pct
    FROM population_growth
    GROUP BY country_code, country, region
)
SELECT country_code, country, region, growth_2015_pct, growth_2023_pct,
       round(growth_2023_pct - growth_2015_pct, 3) AS change_pp
FROM endpoints
WHERE growth_2015_pct IS NOT NULL AND growth_2023_pct IS NOT NULL
ORDER BY change_pp DESC, country_code
"""
